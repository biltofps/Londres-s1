<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>rsg-inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
      <div class="stage">
        <div class="layout">
            <!-- Player -->
            <section class="panel" id="panel-player">
                <!-- player info, 2 columns -->
                <div class="pi-tiles">
                    <div class="pi-tile">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" /></svg>
                        <span data-l="ui_firstname">First name</span><b id="pi-first">—</b>
                    </div>
                    <div class="pi-tile">
                        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" /><path d="M16 4.5a3.5 3.5 0 0 1 0 7" /><path d="M18 14.3c2 .8 3.5 2.8 3.5 5.7" /></svg>
                        <span data-l="ui_lastname">Last name</span><b id="pi-last">—</b>
                    </div>
                    <div class="pi-tile">
                        <svg viewBox="0 0 24 24"><path d="M9 3L7 21" /><path d="M17 3l-2 18" /><path d="M4 9h17" /><path d="M3 15h17" /></svg>
                        <span data-l="ui_server_id">ID</span><b id="pi-id">—</b>
                    </div>
                    <div class="pi-tile">
                        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="9" cy="11" r="2" /><path d="M6 16c.6-1.5 1.7-2.2 3-2.2s2.4.7 3 2.2" /><path d="M15 10h3" /><path d="M15 14h3" /></svg>
                        <span data-l="ui_citizenid">Citizen ID</span><b id="pi-cid">—</b>
                    </div>
                    <div class="pi-tile" data-money="cash">
                        <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2" /><circle cx="12" cy="12" r="2.5" /><path d="M6 9.5v5" /><path d="M18 9.5v5" /></svg>
                        <span data-l="ui_cash">Cash</span><b id="pi-cash">$0.00</b>
                    </div>
                    <div class="pi-tile">
                        <svg viewBox="0 0 24 24"><path d="M3 19l2.5-6h7l2.5 6z" /><path d="M9 19l2.5-6" /><path d="M8.5 13l2-5h6l2.5 6" /><path d="M15 19h6l-2-5" /></svg>
                        <span data-l="ui_gold">Gold</span><b id="pi-gold">0</b>
                    </div>
                    <div class="pi-tile" data-money="bloodmoney">
                        <svg viewBox="0 0 24 24"><path d="M12 3c-3 4-6 7-6 10a6 6 0 0 0 12 0c0-3-3-6-6-10z" /><path d="M10 14.5a2.5 2.5 0 0 0 2 2" /></svg>
                        <span data-l="ui_bloodmoney">Blood money</span><b id="pi-blood">$0.00</b>
                    </div>
                    <div class="pi-tile">
                        <svg viewBox="0 0 24 24"><path d="M14 4l6 6" /><path d="M17 7L8 16" /><path d="M8 16l-4 4" /><path d="M11 2l2 2-7 7-2-2z" /></svg>
                        <span data-l="ui_job">Job</span><b id="pi-job">—</b>
                    </div>
                </div>
                <div class="weight">
                    <div class="meter">
                        <div class="weight-text"><span data-l="ui_weight" class="meter-label">Weight</span><span id="player-weight">0.0</span> / <span id="player-max">0.0</span> <span data-l="ui_kg">kg</span></div>
                        <div class="bar"><div class="fill stat-good" id="player-bar"></div></div>
                    </div>
                    <div class="meter">
                        <div class="weight-text"><span data-l="ui_slots" class="meter-label">Slots</span><span id="player-used">0</span> / <span id="player-slots">0</span></div>
                        <div class="bar"><div class="fill stat-good" id="player-slotbar"></div></div>
                    </div>
                </div>
                <div class="divider"><span>✦</span></div>
                <div class="filters" id="filter-player"></div>
                <div class="grid" id="grid-player" data-inv="player"></div>
            </section>

            <!-- Other (stash / ground) -->
            <section class="panel" id="panel-other">
                <header class="panel-head">
                    <div class="title" id="other-label" data-l="ui_ground">Ground</div>
                    <div class="subtitle" id="other-sub" data-l="ui_drop_here">Drop items here</div>
                </header>
                <div class="weight">
                    <div class="meter">
                        <div class="weight-text"><span data-l="ui_weight" class="meter-label">Weight</span><span id="other-weight">0.0</span> / <span id="other-max">0.0</span> <span data-l="ui_kg">kg</span></div>
                        <div class="bar"><div class="fill stat-good" id="other-bar"></div></div>
                    </div>
                    <div class="meter">
                        <div class="weight-text"><span data-l="ui_slots" class="meter-label">Slots</span><span id="other-used">0</span> / <span id="other-slots">0</span></div>
                        <div class="bar"><div class="fill stat-good" id="other-slotbar"></div></div>
                    </div>
                </div>
                <div class="divider"><span>✦</span></div>
                <div class="filters" id="filter-other"></div>
                <div class="grid" id="grid-other" data-inv="other"></div>
            </section>
        </div>
      </div>

        <!-- drag here to drop on the ground -->
        <div class="drop-zone drop-bar" data-zone="drop">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11" /><path d="M7 10l5 5 5-5" /><path d="M4 20h16" /></svg>
            <span data-l="ui_drop_item">Drop item</span>
        </div>
    </div>

    <div id="hotbar" class="hotbar hidden"></div>
    <div id="itembox-container"></div>
    <div id="ghost" class="ghost hidden"></div>

    <!-- item tooltip (hover) -->
    <div id="tip" class="tip hidden">
        <div class="tip-title" id="info-title"></div>
        <div class="info-desc" id="info-desc"></div>
        <div class="ink-divider"></div>
        <div class="info-meta" id="info-meta"></div>
    </div>

    <!-- right-click menu -->
    <div id="ctx" class="ctx hidden">
        <div class="ctx-title" id="ctx-title"></div>
        <ul class="ctx-list" id="ctx-list"></ul>
    </div>

    <!-- give: pick a nearby player -->
    <div id="give-modal" class="modal-wrap hidden">
        <div class="modal">
            <div class="stamp modal-stamp" id="give-stamp"><img id="give-img" alt="" onerror="this.style.visibility='hidden'"></div>
            <div class="modal-title" data-l="ui_give_to">Give to</div>
            <div class="modal-desc" id="give-item"></div>
            <div class="ink-divider"></div>
            <ul class="give-list" id="give-list"></ul>
            <div class="modal-actions">
                <button class="wood-btn muted" data-give="cancel" data-l="ui_cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- amount prompt -->
    <div id="amount-modal" class="modal-wrap hidden">
        <div class="modal">
            <div class="stamp modal-stamp hidden" id="amount-modal-stamp"><img id="amount-modal-img" alt="" onerror="this.style.visibility='hidden'"></div>
            <div class="modal-title" id="amount-modal-title"></div>
            <div class="modal-desc hidden" id="amount-modal-desc"></div>
            <div class="ink-divider"></div>
            <input type="number" min="1" id="amount-modal-input" class="amount-input">
            <div class="modal-max" id="amount-modal-max"></div>
            <div class="modal-actions">
                <button class="wood-btn muted" data-modal="cancel" data-l="ui_cancel">Cancel</button>
                <button class="wood-btn" data-modal="confirm" data-l="ui_confirm">Confirm</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
